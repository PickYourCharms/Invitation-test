<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chandrima & Arnab — Wedding Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Galada&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main id="app">

    <!-- =========================
         OPENING COVER
         ========================= -->

    <section class="gate" id="gate">

      <div class="cover-ornament ornament-left" aria-hidden="true"></div>
      <div class="cover-ornament ornament-right" aria-hidden="true"></div>

      <div class="gate-inner">

        <!-- Physical wedding-card artwork -->
        <div class="wedding-logo">
          <img
            src="images/subho-bibaho.png"
            alt="শুভ বিবাহ"
          >
        </div>

        <div class="couple-frame">
          <img
            id="coupleImage"
            src="images/couple.jpg"
            alt="Chandrima and Arnab"
          >
        </div>

        <p class="eyebrow">
          A Wedding Invitation
        </p>

        <div class="couple-names">
          <span>Chandrima</span>
          <small>&amp;</small>
          <span>Arnab</span>
        </div>

        <div class="name-rule" aria-hidden="true">
          <i></i>
          <span>✦</span>
          <i></i>
        </div>

        <p class="intro">
          I would love for you to be part of my wedding celebrations.
        </p>

        <form id="codeForm" class="code-form">

          <label for="inviteCode">
            Your invitation code
          </label>

          <div class="code-row">

            <input
              id="inviteCode"
              name="inviteCode"
              type="text"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              placeholder="Enter your code"
            >

            <button type="submit">
              Open Invitation
            </button>

          </div>

          <p
            class="error"
            id="codeError"
            role="alert"
          ></p>

        </form>

      </div>

    </section>


    <!-- =========================
         PERSONALIZED INVITATION
         ========================= -->

    <section
      class="invitation hidden"
      id="invitation"
    >

      <div id="story"></div>

      <!-- =========================
           CLOSING
           ========================= -->

      <footer class="closing" id="closing">

        <div class="closing-image-frame">
          <img
            id="closingImage"
            src="images/couple-close.jpeg"
            alt="Chandrima"
          >
        </div>

        <div class="closing-ornament" aria-hidden="true">
          ✦
        </div>

        <h2>
          With love,<br>
          Chandrima
        </h2>

        <p>
          Thank you for being a part of these precious moments.
          I can't wait to celebrate with you.
        </p>

        <div class="closing-rule" aria-hidden="true">
          <span>❧</span>
          <i></i>
          <span>❧</span>
        </div>

      </footer>

    </section>

  </main>

  <script src="config/invitation-data.js"></script>
  <script src="script.js"></script>

</body>
</html>
