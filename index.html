<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chandrima & Arnab — Wedding Invitation</title>
    <!-- Traditional Serif Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- OPENING / COVER (Strictly contains subho-bibaho.png here only) -->
    <main id="opening-screen" class="screen-view active-screen">
        <div class="opening-card fade-in-up">
            <img src="images/subho-bibaho.png" alt="শুভ বিবাহ" class="bengali-artwork" />
            
            <div class="photo-frame">
                <img src="images/couple.jpg" alt="Chandrima & Arnab" class="cover-photo" />
            </div>

            <h1 class="couple-names">
                Chandrima <span class="amp">&</span> Arnab
            </h1>
            
            <p class="opening-subtitle">Joyfully invite you to celebrate their wedding</p>

            <div class="invite-entry-box">
                <input type="text" id="invite-code-input" placeholder="Enter invitation code" autocomplete="off" />
                <button id="open-invite-btn" class="ceremonial-action-btn">Open Invitation</button>
                <p id="code-error" class="error-feedback hidden">Please enter a valid invitation code.</p>
            </div>
        </div>
    </main>

    <!-- CONTINUOUS INVITATION JOURNEY (Populated dynamically based on profile codes) -->
    <div id="invitation-journey" class="journey-container hidden">
        <div id="dynamic-events-wrapper">
            <!-- Events rendered dynamically from script.js + config data -->
        </div>

        <!-- CLOSING SECTION (Strictly uses couple-close.jpg, NO subho-bibaho.png) -->
        <section class="event-node closing-node" id="closing-section">
            <div class="node-inner scroll-reveal">
                <div class="photo-frame close-frame">
                    <img src="images/couple-close.jpg" alt="Chandrima and Arnab" class="close-photo" />
                </div>
                <div class="closing-sentiment">
                    <p>As we step into this beautiful journey of togetherness, your presence and blessings mean the world to us.</p>
                </div>
                <h3 class="signoff-title">With love,<br><span>Chandrima</span></h3>
            </div>
        </section>
    </div>

    <!-- Configuration & Application Logic -->
<script src="config/invitation-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
